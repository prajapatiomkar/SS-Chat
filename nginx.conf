events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream socket_nodes {
        # Enable sticky sessions based on IP, essential for Socket.IO polling.
        # By default, ip_hash only looks at the first 3 octets of an IPv4 address.
        # This causes all devices on a local network (e.g. 192.168.0.x) to hit the exact same server!
        # By using "hash $remote_addr consistent", we hash the full IP so local devices get split up.
        hash $remote_addr consistent;

        # The 'app' name comes from our docker-compose service name.
        # Docker Compose will round-robin across all replicas if we scale 'app'
        server app:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://socket_nodes;
            
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # Forward real client IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
