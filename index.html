<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SS-Chat | Real-time Multi-Node Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .modal-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* HEADER BAR (FIXED TOP) */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .brand-logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .room-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }

    .room-selector label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .room-selector input {
      background: transparent;
      border: none;
      color: #fff;
      width: 90px;
      font-weight: 600;
      outline: none;
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      padding: 0.25rem 0.6rem;
      border-radius: 0.375rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .badge {
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-user {
      color: #a5b4fc;
      background: var(--accent-light);
      border-color: rgba(99, 102, 241, 0.3);
      cursor: pointer;
    }

    .badge-server {
      font-family: monospace;
      color: #38bdf8;
    }

    /* CHAT CONTAINER (NEVER HIDDEN BY HEADER) */
    .chat-wrapper {
      margin-top: 75px;
      margin-bottom: 85px;
      padding: 1rem 1.5rem;
      flex-grow: 1;
      max-width: 1000px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    #messages {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .msg-author {
      font-weight: 600;
      color: #818cf8;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .msg-server-tag {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
    }

    .msg-content {
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    /* BOTTOM FORM BAR (FIXED BOTTOM) */
    .app-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
    }

    #form {
      display: flex;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      gap: 0.75rem;
    }

    #input {
      flex-grow: 1;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #input:focus {
      border-color: var(--accent);
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background: var(--accent-hover);
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border: none;
      padding: 0 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    @media (max-width: 640px) {
      .app-header {
        padding: 0 0.75rem;
      }

      .header-right {
        gap: 0.5rem;
      }

      .badge-server {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- USERNAME MODAL -->
  <div id="username-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Welcome to SS-Chat</h2>
      <p>Please enter your username to join the conversation</p>
      <form id="username-form" class="modal-form">
        <input id="username-input" class="input-field" placeholder="e.g. Omkar" required autocomplete="off" autofocus />
        <button type="submit" class="btn-primary">Start Chatting</button>
      </form>
    </div>
  </div>

  <!-- FIXED TOP HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo">⚡ SS-Chat</div>
      <div class="room-selector">
        <label for="room-input">Room:</label>
        <input id="room-input" value="general" autocomplete="off" />
        <button id="join-room-btn" class="btn-sm">Join</button>
      </div>
    </div>
    <div class="header-right">
      <div id="user-badge" class="badge badge-user" title="Click to change username">
        👤 <span id="current-user-display">Anonymous</span>
      </div>
      <div id="server-info" class="badge badge-server">
        Connecting...
      </div>
    </div>
  </header>

  <!-- CHAT MESSAGES WRAPPER -->
  <main class="chat-wrapper">
    <ul id="messages"></ul>
  </main>

  <!-- FIXED BOTTOM FORM -->
  <footer class="app-footer">
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message..." disabled />
      <button class="btn-send" id="send-btn" disabled>Send</button>
      <button class="btn-toggle" id="toggle-btn">Disconnect</button>
    </form>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;
    let currentRoom = "general";
    let username = localStorage.getItem("ss_chat_username") || "";
    let socket = null;

    const usernameModal = document.getElementById("username-modal");
    const usernameForm = document.getElementById("username-form");
    const usernameInput = document.getElementById("username-input");
    const userBadge = document.getElementById("user-badge");
    const currentUserDisplay = document.getElementById("current-user-display");

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const messages = document.getElementById("messages");
    const toggleButton = document.getElementById("toggle-btn");
    const serverInfo = document.getElementById("server-info");

    const roomInput = document.getElementById("room-input");
    const joinRoomBtn = document.getElementById("join-room-btn");

    function initSocket() {
      if (socket) {
        socket.disconnect();
      }

      socket = io({
        auth: {
          serverOffset: 0,
          room: currentRoom,
          username: username,
        },
        ackTimeout: 10000,
        retries: 3,
        transports: ["websocket"],
      });

      socket.on("server info", (serverId) => {
        serverInfo.innerText = `🟢 Node: ${serverId}`;
      });

      socket.on("disconnect", () => {
        serverInfo.innerText = "🔴 Disconnected";
      });

      socket.on("chat message", (msg, serverOffset, serverId, msgUsername) => {
        const item = document.createElement("li");
        item.className = "msg-card";

        const headerDiv = document.createElement("div");
        headerDiv.className = "msg-header";

        const authorSpan = document.createElement("span");
        authorSpan.className = "msg-author";
        authorSpan.innerHTML = `👤 ${escapeHtml(msgUsername || "Anonymous")}`;

        const serverTag = document.createElement("span");
        serverTag.className = "msg-server-tag";
        serverTag.innerText = serverId || "";

        headerDiv.appendChild(authorSpan);
        headerDiv.appendChild(serverTag);

        const contentDiv = document.createElement("div");
        contentDiv.className = "msg-content";
        contentDiv.innerText = msg;

        item.appendChild(headerDiv);
        item.appendChild(contentDiv);

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        socket.auth.serverOffset = serverOffset;
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    function startChatWithUsername(name) {
      username = name.trim();
      if (!username) return;

      localStorage.setItem("ss_chat_username", username);
      currentUserDisplay.innerText = username;
      usernameModal.classList.add("hidden");

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();

      initSocket();
    }

    // Check existing username
    if (username) {
      usernameInput.value = username;
      startChatWithUsername(username);
    } else {
      usernameModal.classList.remove("hidden");
    }

    usernameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const entered = usernameInput.value;
      if (entered) {
        startChatWithUsername(entered);
      }
    });

    userBadge.addEventListener("click", () => {
      usernameInput.value = username;
      usernameModal.classList.remove("hidden");
      usernameInput.focus();
    });

    joinRoomBtn.addEventListener("click", () => {
      const newRoom = roomInput.value.trim() || "general";
      if (newRoom !== currentRoom && socket) {
        currentRoom = newRoom;
        socket.disconnect();
        socket.auth.room = currentRoom;
        socket.auth.serverOffset = 0;
        messages.innerHTML = "";
        counter = 0;
        socket.connect();
      }
    });

    toggleButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (socket && socket.connected) {
        toggleButton.innerText = "Connect";
        socket.disconnect();
      } else if (socket) {
        toggleButton.innerText = "Disconnect";
        socket.connect();
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value && socket && socket.connected) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit("chat message", input.value, clientOffset, username);
        input.value = "";
      }
    });
  </script>
</body>

</html>
