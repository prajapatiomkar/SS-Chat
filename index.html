<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
    }

    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    #input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
    }

    #input:focus {
      outline: none;
    }

    #form>button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages>li {
      padding: 0.5rem 1rem;
    }

    #messages>li:nth-child(odd) {
      background: #efefef;
    }
  </style>
</head>

<body>
  <ul id="messages"></ul>
  <div id="room-selection"
    style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1000; display: flex; align-items: center; gap: 5px;">
    <label for="room-input">Room:</label>
    <input id="room-input" value="general" style="width: 80px; padding: 2px;" autocomplete="off" />
    <button id="join-room-btn" style="padding: 2px 5px; cursor: pointer;">Join</button>
  </div>
  <div id="server-info"
    style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1000;">
    Connecting...
  </div>
  <form id="form" action="">
    <input id="input" autocomplete="off" /><button>Send</button>
    <button id="toggle-btn">Disconnect</button>
  </form>
</body>
<script src="/socket.io/socket.io.js"></script>
<script>
  let counter = 0;
  let currentRoom = "general";

  const socket = io({
    auth: {
      serverOffset: 0,
      room: currentRoom,
    },
    ackTimeout: 10000,
    retries: 3,
    transports: ["websocket"],
  });

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");
  const toggleButton = document.getElementById("toggle-btn");
  const serverInfo = document.getElementById("server-info");

  const roomInput = document.getElementById("room-input");
  const joinRoomBtn = document.getElementById("join-room-btn");

  joinRoomBtn.addEventListener("click", () => {
    const newRoom = roomInput.value.trim() || "general";
    if (newRoom !== currentRoom) {
      currentRoom = newRoom;
      socket.disconnect();
      socket.auth.room = currentRoom;
      socket.auth.serverOffset = 0;
      messages.innerHTML = "";
      counter = 0;
      socket.connect();
    }
  });

  socket.on("server info", (serverId) => {
    serverInfo.innerText = `Connected to: ${serverId}`;
  });

  socket.on("disconnect", () => {
    serverInfo.innerText = "Disconnected";
  });

  toggleButton.addEventListener("click", (e) => {
    e.preventDefault();
    if (socket.connected) {
      toggleButton.innerText = "Connect";
      socket.disconnect();
    } else {
      toggleButton.innerText = "Disconnect";
      socket.connect();
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (input.value) {
      const clientOffset = `${socket.id}-${counter++}`;
      socket.emit("chat message", input.value, clientOffset);
      input.value = "";
    }
  });

  socket.on("chat message", (msg, serverOffset, serverId) => {
    const item = document.createElement("li");
    item.innerHTML = `<strong>[${serverId}]:</strong> ${msg}`;
    messages.appendChild(item);
    window.scrollTo(0, document.body.scrollHeight);
    socket.auth.serverOffset = serverOffset;
  });
</script>

</html>
