<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 4rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .modal-card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
    }

    .modal-card p {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .modal-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn:hover {
      background: #555;
    }

    /* HEADER BAR (RESPONSIVE TOP) */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(240, 240, 240, 0.95);
      border-bottom: 1px solid #ccc;
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      font-size: 13px;
      box-sizing: border-box;
    }

    .header-row-1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-row-2 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: nowrap;
    }

    .header-left input {
      width: 70px;
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 13px;
    }

    .header-left button {
      padding: 3px 8px;
      cursor: pointer;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 13px;
      white-space: nowrap;
    }

    .user-info {
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }

    .server-info {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MESSAGES LIST (MARGIN TOP PREVENTS OVERLAP WITH HEADER) */
    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages > li {
      padding: 0.5rem 1rem;
      word-break: break-word;
    }

    #messages > li:nth-child(odd) {
      background: #efefef;
    }

    /* FORM BAR (FIXED BOTTOM) */
    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      gap: 0.25rem;
    }

    #input {
      border: none;
      padding: 0 0.8rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem 0;
      min-width: 0;
      font-size: 14px;
    }

    #input:focus {
      outline: none;
    }

    #form > button {
      background: #333;
      border: none;
      padding: 0 0.8rem;
      margin: 0.25rem 0;
      border-radius: 3px;
      outline: none;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }

    /* MOBILE RESPONSIVE MEDIA QUERIES */
    @media (max-width: 640px) {
      .top-header {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        padding: 6px 10px;
      }

      .header-row-1 {
        justify-content: space-between;
        width: 100%;
      }

      .header-row-2 {
        justify-content: flex-end;
        width: 100%;
      }

      .server-info {
        max-width: 100%;
        font-size: 11px;
      }

      #messages {
        margin-top: 62px;
      }

      .modal-card {
        max-width: 90%;
        padding: 1.2rem;
      }
    }

    @media (min-width: 641px) {
      .header-row-1, .header-row-2 {
        display: contents;
      }

      #messages {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>
  <!-- USERNAME MODAL -->
  <div id="username-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Enter Username</h3>
      <p>Please enter your name to start chatting.</p>
      <form id="username-form" class="modal-form">
        <input id="username-input" class="modal-input" placeholder="Your Username" required autocomplete="off" autofocus />
        <button type="submit" class="modal-btn">Join Chat</button>
      </form>
    </div>
  </div>

  <!-- FIXED TOP HEADER (RESPONSIVE) -->
  <div class="top-header">
    <div class="header-row-1">
      <div class="header-left">
        <label for="room-input">Room:</label>
        <input id="room-input" value="general" autocomplete="off" />
        <button id="join-room-btn">Join</button>
      </div>
      <span class="user-info" id="user-display-btn" title="Click to change username">User: <span id="user-name-display">Anonymous</span></span>
    </div>
    <div class="header-row-2">
      <div id="server-info" class="server-info">Connecting...</div>
    </div>
  </div>

  <!-- CHAT MESSAGES -->
  <ul id="messages"></ul>

  <!-- FIXED BOTTOM FORM -->
  <form id="form" action="">
    <input id="input" autocomplete="off" disabled placeholder="Type a message..." /><button id="send-btn" disabled>Send</button>
    <button id="toggle-btn">Disconnect</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;
    let currentRoom = "general";
    let username = localStorage.getItem("ss_chat_username") || "";
    let socket = null;

    const usernameModal = document.getElementById("username-modal");
    const usernameForm = document.getElementById("username-form");
    const usernameInput = document.getElementById("username-input");
    const userDisplayBtn = document.getElementById("user-display-btn");
    const userNameDisplay = document.getElementById("user-name-display");

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const messages = document.getElementById("messages");
    const toggleButton = document.getElementById("toggle-btn");
    const serverInfo = document.getElementById("server-info");

    const roomInput = document.getElementById("room-input");
    const joinRoomBtn = document.getElementById("join-room-btn");

    function capitalize(str) {
      if (!str) return "Anonymous";
      return str
        .trim()
        .split(/\s+/)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    function initSocket() {
      if (socket) {
        socket.disconnect();
      }

      socket = io({
        auth: {
          serverOffset: 0,
          room: currentRoom,
          username: username,
        },
        ackTimeout: 10000,
        retries: 3,
        transports: ["websocket"],
      });

      socket.on("connect", () => {
        toggleButton.innerText = "Disconnect";
        input.disabled = false;
        sendBtn.disabled = false;
      });

      socket.on("server info", (serverId) => {
        serverInfo.innerText = `Connected to: ${serverId}`;
      });

      socket.on("disconnect", () => {
        serverInfo.innerText = "Disconnected";
        toggleButton.innerText = "Connect";
      });

      socket.on("chat message", (msg, serverOffset, serverId, msgUsername) => {
        const item = document.createElement("li");
        const formattedName = escapeHtml(capitalize(msgUsername));
        item.innerHTML = `<strong><span style="text-transform: capitalize;">${formattedName}</span>:</strong> ${escapeHtml(msg)}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        socket.auth.serverOffset = serverOffset;
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    function startChatWithUsername(name) {
      username = capitalize(name);
      if (!username || username === "Anonymous") return;

      localStorage.setItem("ss_chat_username", username);
      userNameDisplay.innerText = username;
      usernameModal.classList.add("hidden");

      input.disabled = false;
      sendBtn.disabled = false;
      toggleButton.innerText = "Disconnect";
      input.focus();

      initSocket();
    }

    if (username) {
      usernameInput.value = username;
      startChatWithUsername(username);
    } else {
      usernameModal.classList.remove("hidden");
    }

    usernameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const entered = usernameInput.value;
      if (entered) {
        startChatWithUsername(entered);
      }
    });

    userDisplayBtn.addEventListener("click", () => {
      usernameInput.value = username;
      usernameModal.classList.remove("hidden");
      usernameInput.focus();
    });

    joinRoomBtn.addEventListener("click", () => {
      const newRoom = roomInput.value.trim() || "general";
      if (newRoom !== currentRoom && socket) {
        currentRoom = newRoom;
        socket.disconnect();
        socket.auth.room = currentRoom;
        socket.auth.serverOffset = 0;
        messages.innerHTML = "";
        counter = 0;
        socket.connect();
      }
    });

    toggleButton.addEventListener("click", (e) => {
      e.preventDefault();
      if (socket && socket.connected) {
        // Disconnect socket
        socket.disconnect();

        // Clear stored username & info
        username = "";
        localStorage.removeItem("ss_chat_username");
        userNameDisplay.innerText = "Anonymous";
        usernameInput.value = "";

        // Disable input until name is entered
        input.disabled = true;
        sendBtn.disabled = true;
        toggleButton.innerText = "Connect";

        // Show enter name modal prompt
        usernameModal.classList.remove("hidden");
        setTimeout(() => usernameInput.focus(), 100);
      } else {
        // If user clicks connect, prompt for username if empty
        if (!username) {
          usernameModal.classList.remove("hidden");
          setTimeout(() => usernameInput.focus(), 100);
        } else if (socket) {
          toggleButton.innerText = "Disconnect";
          socket.connect();
        }
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value && socket && socket.connected) {
        const clientOffset = `${socket.id}-${counter++}`;
        socket.emit("chat message", input.value, clientOffset, username);
        input.value = "";
      }
    });
  </script>
</body>

</html>
